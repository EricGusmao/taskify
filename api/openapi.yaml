openapi: "3.1.0"
info:
  title: Taskify API
  version: 1.0.0
  description: Team-based task management API

servers:
  - url: http://localhost:8080
    description: Local development server

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathTeamID:
      name: id
      in: path
      required: true
      description: Team ID
      schema:
        type: integer
        format: int64
        minimum: 1

    PathTaskID:
      name: id
      in: path
      required: true
      description: Task ID
      schema:
        type: integer
        format: int64
        minimum: 1

    QueryPage:
      name: page
      in: query
      required: false
      description: Page number (default 1)
      schema:
        type: integer
        minimum: 1
        default: 1

    QueryPageSize:
      name: page_size
      in: query
      required: false
      description: Number of items per page (default 20, max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable error description
          example: "invalid request body"

    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: "Alice Smith"
        email:
          type: string
          format: email
          example: "alice@example.com"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: "supersecret123"

    RegisterResponse:
      type: object
      required:
        - id
        - name
        - email
        - score
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Alice Smith"
        email:
          type: string
          format: email
          example: "alice@example.com"
        score:
          type: integer
          example: 0

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "alice@example.com"
        password:
          type: string
          format: password
          example: "supersecret123"

    LoginResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: JWT bearer token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    CreateTeamRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: "Engineering"

    CreateTeamResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Engineering"

    AddMemberRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: integer
          format: int64
          minimum: 1
          example: 42

    AddMemberResponse:
      type: object
      required:
        - team_id
        - user_id
      properties:
        team_id:
          type: integer
          format: int64
          example: 1
        user_id:
          type: integer
          format: int64
          example: 42

    MemberResponse:
      type: object
      required:
        - user_id
        - name
        - email
        - score
      properties:
        user_id:
          type: integer
          format: int64
          example: 42
        name:
          type: string
          example: "Alice Smith"
        email:
          type: string
          format: email
          example: "alice@example.com"
        score:
          type: integer
          example: 150

    ListMembersResponse:
      type: object
      required:
        - data
        - page
        - page_size
        - total
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MemberResponse"
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 20
        total:
          type: integer
          format: int64
          example: 5

    RankingEntryResponse:
      type: object
      required:
        - rank
        - user_id
        - name
        - email
        - score
      properties:
        rank:
          type: integer
          example: 1
        user_id:
          type: integer
          format: int64
          example: 42
        name:
          type: string
          example: "Alice Smith"
        email:
          type: string
          format: email
          example: "alice@example.com"
        score:
          type: integer
          example: 500

    RankingResponse:
      type: object
      required:
        - data
        - page
        - page_size
        - total
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RankingEntryResponse"
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 20
        total:
          type: integer
          format: int64
          example: 5

    CreateTaskRequest:
      type: object
      required:
        - title
        - points
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: "Write unit tests"
        points:
          type: integer
          minimum: 1
          example: 10

    CreateTaskResponse:
      type: object
      required:
        - id
        - title
        - points
        - team_id
      properties:
        id:
          type: integer
          format: int64
          example: 7
        title:
          type: string
          example: "Write unit tests"
        points:
          type: integer
          example: 10
        team_id:
          type: integer
          format: int64
          example: 1

    TaskItemResponse:
      type: object
      required:
        - id
        - title
        - points
        - team_id
        - done_by_user_id
        - done_at
      properties:
        id:
          type: integer
          format: int64
          example: 7
        title:
          type: string
          example: "Write unit tests"
        points:
          type: integer
          example: 10
        team_id:
          type: integer
          format: int64
          example: 1
        done_by_user_id:
          type: integer
          format: int64
          nullable: true
          example: 42
        done_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-03-30T14:00:00Z"

    ListTasksResponse:
      type: object
      required:
        - data
        - page
        - page_size
        - total
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TaskItemResponse"
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 20
        total:
          type: integer
          format: int64
          example: 3

    CompleteTaskResponse:
      type: object
      required:
        - id
        - title
        - points
        - team_id
        - done_by_user_id
        - done_at
      properties:
        id:
          type: integer
          format: int64
          example: 7
        title:
          type: string
          example: "Write unit tests"
        points:
          type: integer
          example: 10
        team_id:
          type: integer
          format: int64
          example: 1
        done_by_user_id:
          type: integer
          format: int64
          nullable: true
          example: 42
        done_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-03-30T14:00:00Z"

    UploadAvatarResponse:
      type: object
      required:
        - avatar_url
      properties:
        avatar_url:
          type: string
          description: Public URL of the uploaded avatar
          example: "/uploads/avatars/42_avatar.png"

paths:
  /auth/register:
    post:
      summary: Register a new user
      operationId: registerUser
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "409":
          description: Email already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "email already taken"
        "422":
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "invalid request body"

  /auth/login:
    post:
      summary: Authenticate and obtain a JWT
      operationId: loginUser
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "invalid credentials"
        "422":
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "invalid request body"

  /teams:
    post:
      summary: Create a new team
      operationId: createTeam
      tags:
        - teams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Team created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTeamResponse"
        "401":
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Unauthorized"
        "409":
          description: Team name already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "team name already taken"
        "422":
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "invalid request body"

  /teams/{id}/members:
    post:
      summary: Add a user to a team
      operationId: addTeamMember
      tags:
        - teams
      parameters:
        - $ref: "#/components/parameters/PathTeamID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "201":
          description: Member added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddMemberResponse"
        "400":
          description: Invalid team ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "invalid team id"
        "401":
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Unauthorized"
        "404":
          description: Team or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "team not found"
        "409":
          description: User is already a member of this team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "user is already a member of this team"
        "422":
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "invalid request body"

    get:
      summary: List members of a team with their scores
      operationId: listTeamMembers
      tags:
        - teams
      parameters:
        - $ref: "#/components/parameters/PathTeamID"
        - $ref: "#/components/parameters/QueryPage"
        - $ref: "#/components/parameters/QueryPageSize"
      responses:
        "200":
          description: Paginated list of team members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMembersResponse"
        "400":
          description: Invalid team ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "invalid team id"
        "401":
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Unauthorized"
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "team not found"

  /teams/{id}/tasks:
    post:
      summary: Create a task for a team
      operationId: createTask
      tags:
        - tasks
      parameters:
        - $ref: "#/components/parameters/PathTeamID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTaskResponse"
        "400":
          description: Invalid team ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "invalid team id"
        "401":
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Unauthorized"
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "team not found"
        "422":
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "invalid request body"

    get:
      summary: List tasks for a team
      operationId: listTeamTasks
      tags:
        - tasks
      parameters:
        - $ref: "#/components/parameters/PathTeamID"
        - name: done
          in: query
          required: false
          description: Filter tasks by completion status
          schema:
            type: boolean
        - $ref: "#/components/parameters/QueryPage"
        - $ref: "#/components/parameters/QueryPageSize"
      responses:
        "200":
          description: Paginated list of team tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTasksResponse"
        "400":
          description: Invalid team ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "invalid team id"
        "401":
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Unauthorized"
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "team not found"

  /tasks/{id}/complete:
    patch:
      summary: Mark a task as completed by the authenticated user
      operationId: completeTask
      tags:
        - tasks
      parameters:
        - $ref: "#/components/parameters/PathTaskID"
      responses:
        "200":
          description: Task marked as completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteTaskResponse"
        "400":
          description: Invalid task ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "invalid task id"
        "401":
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Unauthorized"
        "403":
          description: User is not a member of the task's team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "forbidden"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "task not found"
        "409":
          description: Task already completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "task already completed"

  /teams/{id}/ranking:
    get:
      summary: Get team member ranking ordered by score
      operationId: getTeamRanking
      tags:
        - teams
      parameters:
        - $ref: "#/components/parameters/PathTeamID"
        - $ref: "#/components/parameters/QueryPage"
        - $ref: "#/components/parameters/QueryPageSize"
      responses:
        "200":
          description: Paginated ranking of team members by score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankingResponse"
        "400":
          description: Invalid team ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "invalid team id"
        "401":
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Unauthorized"
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "team not found"

  /users/me/avatar:
    post:
      summary: Upload a profile picture for the authenticated user
      operationId: uploadAvatar
      tags:
        - users
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Image file (jpeg, png, or webp; max 5 MB)
      responses:
        "200":
          description: Avatar uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadAvatarResponse"
        "400":
          description: Avatar file missing from request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "avatar file is required"
        "401":
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Unauthorized"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "user not found"
        "422":
          description: Unsupported file format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "unsupported file format: only jpeg, png, and webp are allowed"

tags:
  - name: auth
    description: Authentication endpoints (no JWT required)
  - name: teams
    description: Team and member management
  - name: tasks
    description: Task creation and completion
  - name: users
    description: User profile management
