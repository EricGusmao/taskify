services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: taskify
      MYSQL_USER: taskify
      MYSQL_PASSWORD: taskifypassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrate:
    build: .
    entrypoint: ["/migrate"]
    environment:
      DATABASE_DSN: taskify:taskifypassword@tcp(mysql:3306)/taskify?parseTime=true
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_DSN: taskify:taskifypassword@tcp(mysql:3306)/taskify?parseTime=true
      JWT_SECRET: dev-jwt-secret-key-only-for-local-development-do-not-use-in-production-ever
      PORT: "8080"
      UPLOAD_PATH: /uploads/avatars
    volumes:
      - uploads:/uploads
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  mysql_data:
  uploads:
